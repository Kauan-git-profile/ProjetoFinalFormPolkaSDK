[package]
name = "carbon_credit_token"
version = "0.1.0"
edition = "2021"
authors = ["Luiz Rodrigues <luiz.rodrigues@unioeste.br>", "Kauan Carlos Campos <kauan.campos@unioeste.br"]
autobins = false

[dependencies]
ink = { version = "5.0.2", default-features = false }
scale = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }
scale-info = { version = "2", default-features = false, features = ["derive"], optional = true }

[lib]
path = "lib.rs"

[features]
default = ["std"]

std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
]

ink-as-dependency = []
